<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 680" role="img" aria-label="Zarif tarih ve geri sayım bölümü tasarım denemesi">
  <defs>
    <linearGradient id="paperGlow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f7f0"/>
      <stop offset="0.52" stop-color="#edf1e9"/>
      <stop offset="1" stop-color="#e8ede4"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2a2b28" flood-opacity="0.08"/>
    </filter>
    <style>
      .bg{fill:url(#paperGlow)}
      .cream{fill:#fffaf4}
      .ink{fill:#292a27}
      .muted{fill:#6e7166}
      .sage{fill:#6e7d62}
      .gold{fill:#b7935f}
      .line{fill:none;stroke:#b7935f;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
      .hair{fill:none;stroke:#6e7d62;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round;opacity:.65}
      .rule{stroke:#d8cbbb;stroke-width:1}
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:Arial,Helvetica,sans-serif}
    </style>
  </defs>

  <rect class="bg" width="430" height="680"/>

  <g opacity=".55">
    <path class="hair" d="M72 145c38-42 84-58 137-47"/>
    <path class="hair" d="M358 145c-38-42-84-58-137-47"/>
    <path class="hair" d="M85 520c40 30 84 38 132 22"/>
    <path class="hair" d="M345 520c-40 30-84 38-132 22"/>
  </g>

  <g transform="translate(0 16)">
    <text x="215" y="130" text-anchor="middle" class="sage sans" font-size="12" font-weight="700" letter-spacing="5">TARİH</text>

    <g filter="url(#softShadow)">
      <rect x="82" y="154" width="266" height="206" rx="2" class="cream"/>
      <rect x="82.5" y="154.5" width="265" height="205" rx="2" fill="none" stroke="#d8cbbb"/>
      <line x1="82" y1="197" x2="348" y2="197" class="rule"/>
      <line x1="82" y1="318" x2="348" y2="318" class="rule"/>

      <text x="215" y="181" text-anchor="middle" class="sage sans" font-size="12" font-weight="700" letter-spacing="4">EYLÜL</text>
      <text x="215" y="292" text-anchor="middle" class="ink serif" font-size="92" font-weight="400">24</text>
      <text x="215" y="344" text-anchor="middle" class="sage sans" font-size="12" font-weight="700" letter-spacing="4">PERŞEMBE</text>
    </g>

    <g class="line" opacity=".9">
      <path d="M115 144c20-14 40-18 61-11"/>
      <path d="M254 133c21-7 41-3 61 11"/>
      <path d="M118 371c18 12 39 15 62 8"/>
      <path d="M250 379c23 7 44 4 62-8"/>
      <path d="M189 129c8-11 18-11 26 0 8-11 18-11 26 0"/>
    </g>

    <g transform="translate(43 402)">
      <g filter="url(#softShadow)">
        <rect x="0" y="0" width="76" height="82" rx="2" class="cream"/>
        <rect x=".5" y=".5" width="75" height="81" rx="2" fill="none" stroke="#ded3c4"/>
        <text x="38" y="43" text-anchor="middle" class="ink serif" font-size="25">111</text>
        <text x="38" y="61" text-anchor="middle" class="muted sans" font-size="10" letter-spacing="1.4">GÜN</text>
      </g>

      <g transform="translate(88 0)" filter="url(#softShadow)">
        <rect x="0" y="0" width="76" height="82" rx="2" class="cream"/>
        <rect x=".5" y=".5" width="75" height="81" rx="2" fill="none" stroke="#ded3c4"/>
        <text x="38" y="43" text-anchor="middle" class="ink serif" font-size="25">02</text>
        <text x="38" y="61" text-anchor="middle" class="muted sans" font-size="10" letter-spacing="1.4">SAAT</text>
      </g>

      <g transform="translate(176 0)" filter="url(#softShadow)">
        <rect x="0" y="0" width="76" height="82" rx="2" class="cream"/>
        <rect x=".5" y=".5" width="75" height="81" rx="2" fill="none" stroke="#ded3c4"/>
        <text x="38" y="43" text-anchor="middle" class="ink serif" font-size="25">45</text>
        <text x="38" y="61" text-anchor="middle" class="muted sans" font-size="10" letter-spacing="1.4">DAKİKA</text>
      </g>

      <g transform="translate(264 0)" filter="url(#softShadow)">
        <rect x="0" y="0" width="76" height="82" rx="2" class="cream"/>
        <rect x=".5" y=".5" width="75" height="81" rx="2" fill="none" stroke="#ded3c4"/>
        <text x="38" y="43" text-anchor="middle" class="ink serif" font-size="25">46</text>
        <text x="38" y="61" text-anchor="middle" class="muted sans" font-size="10" letter-spacing="1.4">SANİYE</text>
      </g>
    </g>

    <g transform="translate(215 548)">
      <line x1="-72" y1="0" x2="-20" y2="0" class="rule"/>
      <circle cx="0" cy="0" r="3" class="gold"/>
      <line x1="20" y1="0" x2="72" y2="0" class="rule"/>
      <text x="0" y="31" text-anchor="middle" class="sage sans" font-size="10" font-weight="700" letter-spacing="3">HATİCE &amp; ONUR</text>
    </g>
  </g>
</svg>
